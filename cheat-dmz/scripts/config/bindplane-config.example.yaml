# ============================================================================
# BindPlane Agent Configuration for CHeaT DMZ Defense
# Google SecOps Collection Agent (OpenTelemetry-based)
# ============================================================================
# Este arquivo configura o BindPlane Agent para coletar:
#   1. Logs CHeaT (eventos de honeytokens, traps, alertas)
#   2. Windows Event Logs (Security, Application)
#   3. Logs IIS (se aplicável)
#
# Edite os campos marcados com <CHANGE_ME> antes de usar.
# ============================================================================

receivers:
  # --- Windows Event Logs ---
  windowseventlog/application:
    channel: Application
    poll_interval: 1s
  
  windowseventlog/security:
    channel: Security
    poll_interval: 1s

  windowseventlog/system:
    channel: System
    poll_interval: 5s

  # --- CHeaT Defense Logs (JSONL) ---
  filelog/cheat_events:
    include:
      - C:\CHeaT\secops-logs\*.jsonl
    start_at: end
    poll_interval: 5s
    multiline:
      line_start_pattern: '^\{'
    attributes:
      log_source: cheat_defense

  # --- IIS Logs (se aplicável) ---
  filelog/iis:
    include:
      - C:\inetpub\logs\LogFiles\**\*.log
    start_at: end
    poll_interval: 10s
    attributes:
      log_source: iis_web_server

processors:
  batch:
    send_batch_size: 200
    timeout: 10s

  # Adicionar metadados CHeaT
  attributes/cheat_metadata:
    actions:
      - key: log_type
        value: CHEAT_DEFENSE
        action: upsert
      - key: namespace
        value: cheat_dmz_defense
        action: upsert
      - key: environment
        value: dmz
        action: upsert

  # Filtrar eventos de baixa prioridade
  filter/security_relevant:
    logs:
      include:
        match_type: regexp
        record_attributes:
          - key: log_source
            value: "cheat_defense|iis_web_server"

exporters:
  # --- Google SecOps: CHeaT Events ---
  chronicle/cheat:
    endpoint: <CHANGE_ME>malachiteingestion-pa.googleapis.com:443
    creds_file_path: C:\CHeaT\secops-config\service-account.json
    customer_id: <CHANGE_ME_CUSTOMER_ID>
    log_type: CHEAT_DEFENSE
    raw_log_field: body
    override_log_type: true

  # --- Google SecOps: Windows Event Logs ---
  chronicle/winevtlog:
    endpoint: <CHANGE_ME>malachiteingestion-pa.googleapis.com:443
    creds_file_path: C:\CHeaT\secops-config\service-account.json
    customer_id: <CHANGE_ME_CUSTOMER_ID>
    log_type: WINEVTLOG
    raw_log_field: body

  # --- Google SecOps: IIS Logs ---
  chronicle/iis:
    endpoint: <CHANGE_ME>malachiteingestion-pa.googleapis.com:443
    creds_file_path: C:\CHeaT\secops-config\service-account.json
    customer_id: <CHANGE_ME_CUSTOMER_ID>
    log_type: IIS
    raw_log_field: body

service:
  pipelines:
    # Pipeline CHeaT Events -> Google SecOps
    logs/cheat:
      receivers: [filelog/cheat_events]
      processors: [batch, attributes/cheat_metadata]
      exporters: [chronicle/cheat]

    # Pipeline Windows Events -> Google SecOps
    logs/windows:
      receivers: [windowseventlog/application, windowseventlog/security, windowseventlog/system]
      processors: [batch]
      exporters: [chronicle/winevtlog]

    # Pipeline IIS Logs -> Google SecOps
    logs/iis:
      receivers: [filelog/iis]
      processors: [batch]
      exporters: [chronicle/iis]
